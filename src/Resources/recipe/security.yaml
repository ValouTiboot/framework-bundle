security:
    # https://symfony.com/doc/current/security.html#where-do-users-come-from-user-providers
    
    encoders:
        Digitix\FrameworkBundle\Entity\User:
            algorithm: bcrypt
    providers:
        dgtx_admin_user_provider:
            entity:
                class: Digitix\FrameworkBundle\Entity\User
                property: email
        # users_in_memory: { memory: null }
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        dgtx_admin:
            pattern: ^/admin
            anonymous: true
            lazy: true
            provider: dgtx_admin_user_provider
            guard:
                authenticators:
                    - Digitix\FrameworkBundle\Security\AdminAuthenticator
            logout:
                path: dgtx_admin_logout
            remember_me:
                secret:   '%kernel.secret%'
                lifetime: 604800 # 1 week in seconds
                path: /admin
                # by default, the feature is enabled by checking a
                # checkbox in the login form (see below), uncomment the
                # following line to always enable it.
                #always_remember_me: true
        main:
            anonymous: true
            lazy: true
            # provider: users_in_memory

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#firewalls-authentication

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/admin/$, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/admin, roles: ROLE_SUPER_ADMIN }
